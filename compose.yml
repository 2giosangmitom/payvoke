# Production stack: docker compose up -d --build
#
# Secrets and public URLs come from ./.env (copy .env.example). Each service
# also reads its own apps/<service>/.env for keys, RPC and gas limits; the
# values set here override those files so every container uses this stack's
# Postgres, Redis and object storage.
#
# Only the web app, the API and object storage (presigned URLs are fetched by
# browsers) are published, on BIND_ADDRESS. Put a TLS reverse proxy in front.

x-stack: &stack
  DATABASE_URL: postgresql://payvoke:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/payvoke
  REDIS_URL: redis://redis:6379
  API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN}

x-storage: &storage
  FILES_ENABLED: "true"
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-payvoke-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"

x-backend: &backend
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payvoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: payvoke
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payvoke -d payvoke"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Wake-ups and job queues only; Postgres stays the source of truth. noeviction
  # keeps BullMQ from silently losing queued jobs under memory pressure.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    # Loopback only, for host-side tools and services run outside Docker.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for buyer inputs and provider artifacts.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      # Browsers PUT and GET presigned URLs directly from the web app.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once; later runs find it and exit.
  storage-init:
    image: amazon/aws-cli:2.37.12
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-payvoke-files}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    depends_on:
      rustfs: { condition: service_healthy }

  # One-shot: applies pending Prisma migrations before any service starts.
  migrate:
    build: { context: ., dockerfile: packages/payvoke-db/Dockerfile }
    environment:
      DATABASE_URL: postgresql://payvoke:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/payvoke
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [apps/api/.env]
    environment:
      <<: [*stack, *storage]
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      HOST: 0.0.0.0
      PORT: 3001
      FACILITATOR_URL: http://facilitator:3002
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    depends_on:
      facilitator: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  # Private: reachable only by name on the compose network, never published.
  # Requires the active deployment policy row; see the README deploy section.
  facilitator:
    <<: *backend
    build: { context: ., dockerfile: apps/facilitator/Dockerfile }
    env_file: [apps/facilitator/.env]
    environment:
      <<: *stack
      HOST: 0.0.0.0
      PORT: 3002
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require("net").connect(3002, "127.0.0.1").on("connect", () => process.exit(0)).on("error", () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  settlement-worker:
    <<: *backend
    build: { context: ., dockerfile: apps/settlement-worker/Dockerfile }
    env_file: [apps/settlement-worker/.env]
    environment: *stack

  finance-worker:
    <<: *backend
    build: { context: ., dockerfile: apps/finance-worker/Dockerfile }
    env_file: [apps/finance-worker/.env]
    environment: *stack

  # Keyless BullMQ jobs: delivery verification (JSON and files), upload cleanup.
  job-worker:
    <<: *backend
    build: { context: ., dockerfile: apps/job-worker/Dockerfile }
    env_file: [apps/job-worker/.env]
    environment:
      <<: [*stack, *storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN}
        VITE_FUJI_RPC_URL: ${FUJI_RPC_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  rustfs-data:
