# Production stack: docker compose up -d --build
#
# Secrets and public URLs come from ./.env (copy .env.example). The API also
# reads apps/api/.env for keys, RPC and gas limits; the values set here
# override that file so the container uses this stack's Postgres, Redis and
# object storage.
#
# Only the web app, the API and object storage (presigned URLs are fetched by
# browsers) are published, on BIND_ADDRESS. Put a TLS reverse proxy in front.

x-stack: &stack
  DATABASE_URL: postgresql://payvoke:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/payvoke
  REDIS_URL: redis://redis:6379
  API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN}

x-storage: &storage
  FILES_ENABLED: "true"
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-payvoke-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payvoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: payvoke
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payvoke -d payvoke"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Pub/sub wake-ups and rate-limit counters only; Postgres stays the source
  # of truth, and nothing stored here outlives its expiry.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    # Loopback only, for host-side tools and services run outside Docker.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for buyer inputs and provider artifacts.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      # Browsers PUT and GET presigned URLs directly from the web app.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once; later runs find it and exit.
  storage-init:
    image: amazon/aws-cli:2.37.12
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-payvoke-files}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    depends_on:
      rustfs: { condition: service_healthy }

  # One-shot: applies pending Prisma migrations before the API starts.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://payvoke:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/payvoke
    depends_on:
      db: { condition: service_healthy }

  # API, in-process x402 facilitator and the workers apps/api/.env enables
  # (JOB_WORKER_ENABLED, SETTLEMENT_WORKER_ENABLED, FINANCE_WORKER_ENABLED).
  # Run exactly one replica: the signing workers keep one nonce lane each.
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [apps/api/.env]
    environment:
      <<: [*stack, *storage]
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    # Settlement and finance finish an in-flight transaction before exiting.
    stop_grace_period: 160s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN}
        VITE_FUJI_RPC_URL: ${FUJI_RPC_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  rustfs-data:
