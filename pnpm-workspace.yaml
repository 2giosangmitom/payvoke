packages:
  - apps/*
  - packages/*
  - tests/*

allowBuilds:
  esbuild: true
  # Optional native msgpack speedup for BullMQ; the pure JS fallback is enough.
  msgpackr-extract: false
  protobufjs: true

permissions:
  "@openuidev/lang-core":
    build: true
  "@prisma/engines":
    build: true
  "@tanstack/react-start":
    skills: true
  hardhat:
    skills: true
  prisma:
    build: true
  "@open-slide/core":
    skills: true
  "@tanstack/react-router":
    skills: true

skills:
  dirs:
    - .agents/skills
    - .claude/skills
